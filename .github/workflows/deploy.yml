name: Build & Deploy Static Website for WordPress Hosting

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Static Site for WordPress / Apache
        run: npm run build:static

      - name: Upload Static Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lobo-travels-static-site
          path: out/

      # Optional FTP Deployment to WordPress hosting if FTP credentials are set in GitHub Secrets
      # To enable: Add FTP_SERVER, FTP_USERNAME, FTP_PASSWORD to your GitHub Repository Secrets
      - name: Deploy to WordPress Host via FTP (Optional)
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ./public_html/
